name: Déploiement Production

on:
  push:
    branches: [ "production" ]

permissions:
  contents: read

jobs:
  tests:
    name: Tests PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - uses: actions/checkout@v4

      - name: Cache Composer
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Installer les dépendances
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Créer la base SQLite pour les tests
        run: |
          mkdir -p data
          touch data/database.sqlite

      - name: Exécuter les tests
        env:
          DATABASE_URL: sqlite:///%kernel.project_dir%/data/database.sqlite
        run: vendor/bin/phpunit

  # SPA React (Vite) : le serveur n'a pas Node, la compilation se fait donc ici
  frontend-build:
    name: Build SPA React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances de la SPA
        run: npm ci

      - name: Compiler la SPA (Vite)
        env:
          VITE_ROUTER_BASENAME: /spa
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy:
    name: Déploiement sur production.cf2m.be
    runs-on: ubuntu-latest
    needs: [ tests, frontend-build ]
    steps:
      - name: Récupérer la SPA compilée
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: spa-dist

      # Dépôt temporaire dans var/spa-dist (non versionné, vidé à chaque envoi) ; la mise en place dans public/ se fait après le git pull
      - name: Envoi de la SPA sur le serveur
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          source: spa-dist
          target: /var/www/vhosts/cf2m.be/production.cf2m.be/pre2026.cf2m.be/var/spa-dist
          strip_components: 1
          rm: true

      - name: Déploiement SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -e
            export PATH="/var/www/vhosts/cf2m.be/.phpenv/shims:/var/www/vhosts/cf2m.be/.phpenv/bin:$PATH"
            cd /var/www/vhosts/cf2m.be/production.cf2m.be/pre2026.cf2m.be
            git remote set-url origin https://github.com/mikhawa/pre2026.cf2m.be

            echo "=== Git pull ==="
            git pull origin production

            echo "=== Composer install ==="
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "=== Migrations ==="
            php bin/console doctrine:migrations:migrate --no-interaction --env=prod

            echo "=== Cache ==="
            php bin/console cache:clear --env=prod
            php bin/console cache:warmup --env=prod

            echo "=== Permissions ==="
            find public/uploads var/ -user "$(whoami)" -type d -exec chmod 775 {} \;
            find public/uploads var/ -user "$(whoami)" -type f -exec chmod 664 {} \;

            echo "=== Assets ==="
            php bin/console importmap:install
            php bin/console asset-map:compile --env=prod

            echo "=== SPA React ==="
            test -f var/spa-dist/index.html
            rm -rf public/spa public/spa-assets
            mkdir -p public/spa
            mv var/spa-dist/index.html public/spa/index.html
            mv var/spa-dist/spa-assets public/spa-assets
            rm -rf var/spa-dist


            echo "=== Déploiement terminé ==="
