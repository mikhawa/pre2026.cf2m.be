# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# TODO (mise en production) :
# - Adapter les branches déclenchant le workflow (push/pull_request) selon la stratégie de déploiement
# - Remplacer la base de données SQLite par la vraie base de production (MySQL, PostgreSQL, etc.)
# - Configurer les secrets GitHub (DATABASE_URL, APP_SECRET, etc.) via Settings > Secrets and variables
# - Ajouter une étape de déploiement (ex: SSH, rsync, FTP, Deployer, Docker, etc.)
# - Envisager de séparer le workflow de tests du workflow de déploiement
# - Vérifier que la version de PHP correspond à celle du serveur de production

name: Symfony

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  symfony-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
    - uses: actions/checkout@v4
    - name: Copy .env.test.local
      run: php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Create Database
      run: |
        mkdir -p data
        touch data/database.sqlite
    # Îlots React : le serveur n'a pas Node, le JSX compilé (assets/react/build/) est donc versionné.
    # On vérifie ici qu'il correspond bien aux sources (assets/react/src/).
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - name: Compile React islands (Babel)
      run: |
        npm ci
        npm run react:build
    - name: Check compiled React islands are committed
      run: |
        git add -N assets/react/build
        git diff --exit-code -- assets/react/build || (echo "::error::assets/react/build n'est pas à jour : lancez 'npm run react:build' et commitez le résultat." && exit 1)
    - name: Execute tests (Unit and Feature tests) via PHPUnit
      env:
        DATABASE_URL: sqlite:///%kernel.project_dir%/data/database.sqlite
      run: vendor/bin/phpunit
